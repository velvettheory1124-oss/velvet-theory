# How Netlify deploys this site.
#
# There is no build step. publish.ps1 runs on Varshith's Windows machine
# (PowerShell + System.Drawing, which Netlify's Linux builders cannot
# run), so PUBLISH/ arrives already built and Netlify simply serves it.

[build]
  # nothing to run — the folder is committed ready to serve
  command = ""
  publish = "PUBLISH"

# The owner-only publishing function (see netlify/functions/admin.js). It is
# built by Netlify from the repository, so this only takes effect on deploys
# that come from GitHub, not on a dragged-in folder.
[functions]
  directory = "netlify/functions"

# ---- caching ----
# The photographs never change once published: a new photograph gets a
# new filename. So they can be cached hard, which makes a repeat visit
# almost instant.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The page itself must NOT be cached that way, or a deploy would not
# reach anyone still holding the old copy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The stylesheet changes with the page, so it follows the same rule.
[[headers]]
  for = "/mobile.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- security ----
# Modest, sensible defaults. No framing by other sites, no MIME sniffing,
# and referrer information kept to the origin.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
